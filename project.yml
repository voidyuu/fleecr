name: fleecr
options:
  bundleIdPrefix: dev.bybee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
packages:
  HerdrKit:
    path: Packages/HerdrKit
  GhosttyTerminal:
    path: Packages/GhosttyTerminal
targets:
  fleecr:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: HerdrKit
      - package: GhosttyTerminal
        product: GhosttyTerminal
      - package: GhosttyTerminal
        product: GhosttyKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: fleecr
        CFBundleDisplayName: fleecr
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.fleecr
        PRODUCT_NAME: fleecr
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          # real identity so UserNotifications & friends work in dev builds
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
  fleecrTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: fleecr
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
