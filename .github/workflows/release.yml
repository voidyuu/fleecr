name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "MACOS_CERTIFICATE_P12 not set, skipping certificate import"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodegen generate
          if [ -n "$P12_BASE64" ]; then
            xcodebuild -project fleecr.xcodeproj -scheme fleecr -configuration Release \
              -derivedDataPath build build -skipPackagePluginValidation \
              ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              OTHER_CODE_SIGN_FLAGS="--timestamp" CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
          else
            echo "No Developer ID certificate found. Building with ad-hoc signing."
            xcodebuild -project fleecr.xcodeproj -scheme fleecr -configuration Release \
              -derivedDataPath build build -skipPackagePluginValidation \
              ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual
          fi

      - name: Verify code signature
        run: |
          APP="build/Build/Products/Release/Fleecr.app"
          codesign --verify --deep --strict "$APP"

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - "$VERSION" <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          if not m or not m.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section for {version} — add one before tagging")
          notes = m.group(1).strip()
          open("notes.md", "w").write(notes)
          PYEOF
          echo "--- notes.md ---"; cat notes.md

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/Build/Products/Release/Fleecr.app"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            ditto -c -k --keepParent "$APP" notarize.zip
            xcrun notarytool submit notarize.zip \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            rm notarize.zip
          else
            echo "Apple notarization credentials not set, skipping notarization"
          fi
          ditto -c -k --keepParent "$APP" "fleecr-$VERSION.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "fleecr-$VERSION.zip" \
            --title "fleecr $VERSION" --notes-file notes.md

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "TAP_GITHUB_TOKEN not set, skipping"; exit 0; }
          SHA=$(shasum -a 256 "fleecr-$VERSION.zip" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/voidyuu/homebrew-tap" tap
          cd tap
          sed -i '' -E "s|^  version \".*\"|  version \"$VERSION\"|" Casks/fleecr.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Casks/fleecr.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(fleecr): bump to $VERSION"
          git push
